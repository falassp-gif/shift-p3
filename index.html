<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Shift P3 — Maintenance &amp; Tooling</title>
<meta name="description" content="Jadwal shift Maintenance &amp; Tooling Plant 3">
<meta name="theme-color" content="#16245e">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Shift P3">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --navy-950:#0a1236; --navy-900:#0f1a4a; --navy:#16245e; --blue:#2b4ea7; --blue-2:#3c64c8; --blue-soft:#e8eefc;
  --bg:#eef1f8; --card:#ffffff; --ink:#111a3a; --ink-2:#5d6684; --ink-3:#8f97b2; --line:#e3e7f1; --field:#f2f4fa;
  --accent:#f47b20; --ok:#18915a; --ok-bg:#e3f6ec; --warn:#d1433f; --warn-bg:#fdeceb; --pend:#b7791f; --pend-bg:#fdf3e1;
  /* warna jadwal mengikuti Excel draft */
  --x-p3a:#ffff00; --x-sl:#00b0f0; --x-bd:#7030a0; --x-t3a:#92d050; --x-prv:#9bc2e6; --x-p3b:#ffc000; --x-t3b:#00b050; --x-oth:#d9d9d9;
  --x-sat:#00b050; --x-sun:#ff0000;
  --st-L:#c6e0b4; --st-O:#f8cbad; --st-S:#00f66f; --st-C:#ffc000; --st-4:#b4a7d6;
  --r-xl:26px; --r-lg:20px; --r-md:14px; --shadow:0 10px 30px -12px rgba(16,30,84,.25);
  --font:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{font-family:var(--font);color:var(--ink);background:#0b1238;font-size:15px;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid #8fb0ff;outline-offset:2px}
#app{position:relative;max-width:480px;min-height:100dvh;margin:0 auto;background:var(--bg);overflow-x:hidden}
body.wide #app{max-width:1280px}
@media (min-width:520px){ body{background:radial-gradient(circle at 30% 10%,#1d2c72,#0a1236 70%)} #app{box-shadow:0 0 60px rgba(0,0,0,.35)} }
.hide{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- splash ---------- */
.splash{position:absolute;inset:0;min-height:100dvh;background:#0b1338;overflow:hidden;cursor:pointer;color:#fff}
.splash .ph{position:absolute;inset:0;background-size:cover;background-position:center top}
.splash .ph::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,18,54,0) 55%,rgba(10,18,54,.55) 100%)}
.splash .skip{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));right:14px;z-index:3;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.35);color:#fff;border-radius:999px;padding:8px 16px;font-weight:600;backdrop-filter:blur(6px)}
.splash .tap{position:absolute;left:0;right:0;bottom:calc(26px + var(--safe-b));text-align:center;letter-spacing:.18em;font-size:12px;font-weight:600;color:rgba(255,255,255,.85);z-index:3;animation:pulse 2.2s ease-in-out infinite}
.splash .phb{position:absolute;inset:-20px;background-size:cover;background-position:center;filter:blur(18px) brightness(.55)}
@media (min-aspect-ratio:9/16){ .splash .ph{background-size:contain;background-repeat:no-repeat} }
.splash .brand{position:absolute;left:12px;top:calc(16px + env(safe-area-inset-top,0px));z-index:3;background:#fff;border-radius:8px;padding:4px 7px;box-shadow:0 8px 24px rgba(0,0,0,.3)}
.splash .brand img{height:17px;display:block}
.dot{position:absolute;border-radius:50%;background:rgba(255,236,200,.75);filter:blur(1.5px);z-index:2;animation:float linear infinite}
@keyframes float{0%{transform:translateY(0);opacity:0}15%{opacity:.9}100%{transform:translateY(-140px);opacity:0}}
@keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}
@media (prefers-reduced-motion:reduce){.dot,.splash .tap{animation:none}}

/* ---------- login ---------- */
.login{position:relative;min-height:100dvh;display:flex;flex-direction:column;color:#fff;overflow:hidden}
.login .bgimg{position:absolute;inset:-12px;background-size:cover;background-position:center;filter:blur(3px)}
.login .bgimg::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,18,54,.62),rgba(10,18,54,.88) 60%,#0a1236)}
.login .top{position:relative;padding:calc(28px + env(safe-area-inset-top,0px)) 24px 0;flex:1}
.logo-plate{display:inline-block;background:#fff;border-radius:12px;padding:8px 12px}
.logo-plate img{height:34px;display:block}
.login h1{font-size:34px;line-height:1.12;margin:26px 0 8px;font-weight:800;letter-spacing:-.01em}
.login p.sub{margin:0;color:rgba(255,255,255,.82);font-size:15px;max-width:340px}
.sheet-card{position:relative;background:#f6f7fb;color:var(--ink);border-radius:30px;margin:26px 10px 0;padding:26px 22px 20px}
.fld{display:block;margin-bottom:16px}
.fld>span{display:block;font-size:13px;font-weight:600;color:var(--ink-2);margin:0 0 7px 4px}
.inp{display:flex;align-items:center;gap:10px;background:#eef0f7;border-radius:16px;padding:0 14px;min-height:54px;border:1.5px solid transparent}
.inp:focus-within{border-color:#9db2ec;background:#fff}
.inp svg{flex:none;color:var(--ink-3)}
.inp input{flex:1;border:0;background:transparent;outline:0;font-size:16px;min-width:0;padding:14px 0}
.inp button{border:0;background:none;color:var(--ink-3);padding:6px;display:grid;place-items:center}
.btn-main{width:100%;display:flex;align-items:center;justify-content:center;gap:10px;border:0;border-radius:18px;background:linear-gradient(180deg,#3256b4,#2a4a9f);color:#fff;font-weight:700;font-size:17px;min-height:56px;box-shadow:0 14px 28px -12px rgba(43,78,167,.7);margin-top:10px}
.btn-main:disabled{opacity:.6}
.sheet-card .sub{color:var(--ink-2)}
.hint{font-size:12.5px;color:var(--ink-2);text-align:center;margin:14px 0 0;line-height:1.5}
.err{background:var(--warn-bg);color:var(--warn);border-radius:12px;padding:10px 12px;font-size:13.5px;font-weight:600;margin:0 0 12px}
.mode-pill{position:relative;align-self:center;margin:14px 0 calc(16px + var(--safe-b));background:rgba(255,255,255,.1);border:0;color:rgba(255,255,255,.85);border-radius:999px;padding:8px 16px;font-size:13px}

/* ---------- shell ---------- */
.page{padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(112px + var(--safe-b))}
.ph-row{display:flex;align-items:center;gap:10px;margin:4px 2px 16px}
.ph-row h1{font-size:26px;font-weight:800;margin:0;letter-spacing:-.01em}
.badge-demo{background:#fff2cc;color:#b06a00;font-size:11px;font-weight:800;letter-spacing:.06em;border-radius:8px;padding:3px 8px}
.ph-row .sp{flex:1}
.sync{display:flex;align-items:center;gap:7px;background:#fff;border-radius:999px;padding:8px 13px;font-size:13px;font-weight:600;box-shadow:0 2px 8px rgba(16,30,84,.06)}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--ok)}
.sync.busy i{background:#e0a400;animation:pulse 1s infinite} .sync.err i{background:var(--warn)}
.icon-btn{width:46px;height:46px;border-radius:16px;border:0;background:#fff;display:grid;place-items:center;box-shadow:0 2px 8px rgba(16,30,84,.06);color:var(--ink)}
.icon-btn.spin svg{animation:spin 1s linear infinite} @keyframes spin{to{transform:rotate(360deg)}}

.nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + var(--safe-b));width:min(452px,calc(100% - 28px));background:linear-gradient(180deg,#1a2a6c,#131f55);border-radius:28px;display:flex;padding:8px;gap:2px;z-index:20;box-shadow:0 18px 40px -12px rgba(10,18,54,.6)}
.nav button{flex:1;border:0;background:none;color:rgba(255,255,255,.62);display:flex;flex-direction:column;align-items:center;gap:5px;padding:9px 0 8px;border-radius:20px;font-size:12px;font-weight:600;position:relative}
.nav button.on{background:rgba(255,255,255,.12);color:#fff}
.nav .nb{position:absolute;top:4px;right:calc(50% - 22px);background:var(--accent);color:#fff;font-size:10px;font-weight:800;border-radius:999px;padding:1px 6px}

.card{background:var(--card);border-radius:var(--r-xl);padding:18px;box-shadow:0 2px 10px rgba(16,30,84,.05)}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;margin:22px 4px 12px}
.sec-h h2{font-size:18px;margin:0;font-weight:800}
.sec-h small{color:var(--ink-2);font-size:13px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip-f{flex:none;border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:10px 18px;font-weight:600;color:var(--ink-2);font-size:14px}
.chip-f.on{background:var(--navy-900);border-color:var(--navy-900);color:#fff}

/* hero dashboard */
.hero{position:relative;overflow:hidden;border-radius:28px;padding:20px;color:#fff;background:linear-gradient(135deg,#2c4fae 0%,#1d327e 55%,#16245e 100%);box-shadow:var(--shadow)}
.hero::before,.hero::after{content:"";position:absolute;border-radius:50%;background:rgba(255,255,255,.07)}
.hero::before{width:240px;height:240px;right:-70px;top:-90px} .hero::after{width:180px;height:180px;right:20px;bottom:-110px}
.hero-top{position:relative;display:flex;align-items:center;gap:13px}
.ava{width:52px;height:52px;border-radius:17px;background:rgba(255,255,255,.16);display:grid;place-items:center;font-weight:800;font-size:20px;flex:none}
.hero-top small{display:block;color:rgba(255,255,255,.78);font-size:14px}
.hero-top b{font-size:21px}
.role{margin-left:auto;background:rgba(255,255,255,.18);border-radius:999px;padding:5px 11px;font-size:12px;font-weight:700;white-space:nowrap}
.today{position:relative;margin-top:16px;background:rgba(255,255,255,.1);border-radius:20px;padding:14px}
.today-h{display:flex;justify-content:space-between;gap:8px;color:rgba(255,255,255,.8);font-size:13px}
.today .mine{font-size:21px;font-weight:800;margin:3px 0 2px}
.today .hrs{font-size:13px;color:rgba(255,255,255,.8)}
.today-cols{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.today-cols>div{background:rgba(255,255,255,.1);border-radius:14px;padding:9px 10px;min-height:74px;font-size:13px;line-height:1.45}
.today-cols b{display:block;font-size:14px;margin-bottom:2px}
.today-cols .me{color:#ffd29a;font-weight:700}
.week-strip{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.wd{background:#fff;border-radius:16px;padding:9px 0 10px;text-align:center;box-shadow:0 2px 8px rgba(16,30,84,.05)}
.wd small{display:block;color:var(--ink-3);font-size:11px;font-weight:600}
.wd b{display:block;font-size:16px;margin:2px 0 5px}
.wd.td{outline:2px solid var(--blue);outline-offset:-2px}
.code{display:inline-grid;place-items:center;min-width:34px;height:24px;padding:0 6px;border-radius:8px;font-size:11.5px;font-weight:800;background:var(--blue-soft);color:var(--blue)}
.code.k2{background:#e7f3ff;color:#0b6db3} .code.k3{background:#ece8ff;color:#5b3fc4} .code.k4{background:var(--st-4);color:#2a1f4d}
.code.O{background:var(--st-O);color:#7a2e0e} .code.C{background:var(--st-C);color:#4a3300} .code.L{background:var(--st-L);color:#1d4d16} .code.S{background:var(--st-S);color:#05391c} .code.none{background:#f0f1f5;color:#b3b8c9}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stat{background:#fff;border-radius:22px;padding:16px;box-shadow:0 2px 10px rgba(16,30,84,.05)}
.stat .ic{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;margin-bottom:12px}
.stat b{font-size:28px;font-weight:800;letter-spacing:-.02em} .stat b small{font-size:14px;font-weight:600;color:var(--ink-2);margin-left:4px}
.stat p{margin:2px 0 0;color:var(--ink-2);font-size:13.5px}
.ic.blue{background:#e8eefc;color:#2b4ea7} .ic.green{background:#e3f6ec;color:#18915a} .ic.orange{background:#fdeedf;color:#d0650f} .ic.pink{background:#fde8ef;color:#c2366b} .ic.violet{background:#eeeafd;color:#5b3fc4} .ic.teal{background:#e0f5f5;color:#0e7c7b}
.alert-card{display:flex;align-items:center;gap:12px;background:#fff;border-radius:20px;padding:14px 16px;margin-top:12px;border:0;width:100%;text-align:left;box-shadow:0 2px 10px rgba(16,30,84,.05)}
.alert-card b{display:block} .alert-card small{color:var(--ink-2)}
.alert-card .go{margin-left:auto;color:var(--ink-3)}

/* ---------- jadwal ---------- */
.mnav{display:flex;align-items:center;gap:10px;background:#fff;border-radius:22px;padding:8px;box-shadow:0 2px 10px rgba(16,30,84,.05)}
.mnav b{flex:1;text-align:center;font-size:17px}
.mnav button{width:44px;height:44px;border-radius:14px;border:0;background:var(--field);display:grid;place-items:center}
.seg{display:flex;background:#e3e7f2;border-radius:16px;padding:4px;margin:12px 0}
.seg button{flex:1;border:0;background:none;border-radius:12px;padding:10px 6px;font-weight:700;font-size:13.5px;color:var(--ink-2)}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 2px 6px rgba(16,30,84,.1)}
.wk-chips .chip-f{padding:8px 14px;font-size:13px}
.board-wrap{overflow:auto;background:#fff;border-radius:18px;box-shadow:0 2px 10px rgba(16,30,84,.06);max-height:calc(100dvh - 300px);min-height:300px;-webkit-overflow-scrolling:touch}
table.board{border-collapse:separate;border-spacing:0;font-size:12px;min-width:100%}
.board th,.board td{border-right:1px solid #d5dae6;border-bottom:1px solid #d5dae6;padding:0;vertical-align:top}
.board thead th{position:sticky;background:#fff;z-index:3;font-weight:700}
.board thead tr:first-child th{top:0;height:34px} .board thead tr:nth-child(2) th{top:34px;height:26px;font-size:11px;color:var(--ink-2);font-weight:600}
.board .lbl{position:sticky;left:0;z-index:2;background:#f7f8fc;min-width:52px;max-width:52px;font-size:10.5px;font-weight:700;color:var(--ink-2);text-align:center;vertical-align:middle;padding:2px}
.board thead .lbl{z-index:4}
.board th.dh{padding:0 8px;vertical-align:middle;white-space:nowrap;font-size:12.5px}
.board th.dh.sat{background:var(--x-sat);color:#fff} .board th.dh.sun{background:var(--x-sun);color:#fff}
.board th.dh.today{box-shadow:inset 0 -3px 0 var(--accent)}
.board th.dh button{border:0;background:none;color:inherit;font-weight:700;padding:0}
.board td.tt{font-size:10.5px;font-weight:800;text-align:center;vertical-align:middle;padding:4px;letter-spacing:.02em;white-space:nowrap}
.t-p3a{background:var(--x-p3a)} .t-sl{background:var(--x-sl)} .t-bd{background:var(--x-bd);color:#fff} .t-t3a{background:var(--x-t3a)} .t-prv{background:var(--x-prv)} .t-p3b{background:var(--x-p3b)} .t-t3b{background:var(--x-t3b);color:#fff} .t-oth{background:var(--x-oth)}
.board td.c{min-width:96px;padding:3px}
.board td.c.out{background:repeating-linear-gradient(45deg,#fafbfd,#fafbfd 6px,#f3f4f8 6px,#f3f4f8 12px)}
.nm{display:flex;align-items:center;justify-content:space-between;gap:4px;width:100%;border:1px solid #e2e5ee;background:#fff;border-radius:7px;padding:3px 6px;margin:0 0 3px;font-size:12px;font-weight:600;text-align:left;white-space:nowrap;min-height:26px}
.nm i{font-style:normal;font-size:10px;color:var(--ink-3);font-weight:700}
.nm.L{background:var(--st-L);border-color:transparent} .nm.O{background:var(--st-O);border-color:transparent} .nm.C{background:var(--st-C);border-color:transparent} .nm.S{background:var(--st-S);border-color:transparent} .nm.k4{background:var(--st-4);border-color:transparent}
.nm.me{box-shadow:0 0 0 2px var(--blue)} .nm.hl{box-shadow:0 0 0 2px var(--accent)}
.legend{display:flex;flex-wrap:wrap;gap:8px 14px;font-size:12px;color:var(--ink-2);margin:12px 4px}
.legend span{display:flex;align-items:center;gap:6px} .legend i{width:16px;height:12px;border-radius:4px;display:inline-block;border:1px solid rgba(0,0,0,.08)}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.btn{border:0;border-radius:14px;padding:11px 16px;font-weight:700;background:#fff;color:var(--ink);box-shadow:0 2px 8px rgba(16,30,84,.06);display:inline-flex;align-items:center;gap:8px;min-height:44px}
.btn.pri{background:var(--blue);color:#fff} .btn.ok{background:var(--ok);color:#fff} .btn.no{background:var(--warn-bg);color:var(--warn);box-shadow:none} .btn.ghost{background:var(--field);box-shadow:none}
.btn.sm{min-height:36px;padding:7px 12px;font-size:13px;border-radius:12px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal .h{font-size:11px;font-weight:700;color:var(--ink-3);text-align:center;padding:2px 0}
.cal .d{background:#fff;border-radius:14px;min-height:62px;padding:6px 4px;text-align:center;border:0;display:flex;flex-direction:column;align-items:center;gap:5px;box-shadow:0 1px 6px rgba(16,30,84,.05)}
.cal .d small{font-size:12px;font-weight:700;color:var(--ink-2)}
.cal .d.sun small{color:var(--x-sun)} .cal .d.sat small{color:#0a8a3d}
.cal .d.td{outline:2px solid var(--blue);outline-offset:-2px}
.cal .d.x{visibility:hidden}

/* ---------- list / request / member ---------- */
.list{display:flex;flex-direction:column;gap:10px}
.row-card{display:flex;align-items:center;gap:12px;background:#fff;border-radius:20px;padding:13px 14px;border:0;width:100%;text-align:left;box-shadow:0 2px 10px rgba(16,30,84,.05)}
.row-card .ava{width:44px;height:44px;border-radius:14px;background:var(--blue-soft);color:var(--blue);font-size:16px}
.row-card .tx{flex:1;min-width:0}
.row-card .tx b{display:block;font-size:15px} .row-card .tx small{display:block;color:var(--ink-2);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{display:inline-block;border-radius:999px;padding:4px 10px;font-size:11.5px;font-weight:700;white-space:nowrap}
.pill.sa{background:#efe9ff;color:#5b3fc4} .pill.ad{background:#e3f0ff;color:#1366b8} .pill.mb{background:#eef0f5;color:#5d6684} .pill.off{background:#fde8e8;color:#b42318}
.pill.wait{background:var(--pend-bg);color:var(--pend)} .pill.yes{background:var(--ok-bg);color:var(--ok)} .pill.no{background:var(--warn-bg);color:var(--warn)} .pill.cx{background:#eef0f5;color:#8f97b2}
.req{background:#fff;border-radius:20px;padding:14px 16px;box-shadow:0 2px 10px rgba(16,30,84,.05)}
.req .top{display:flex;align-items:center;gap:8px}
.req .top b{font-size:15px}
.req .top .pill{margin-left:auto}
.req p{margin:6px 0 0;color:var(--ink-2);font-size:13.5px;line-height:1.45}
.req .acts{display:flex;gap:8px;margin-top:12px}
.req .acts .btn{flex:1;justify-content:center}
.form{background:#fff;border-radius:24px;padding:18px;box-shadow:0 2px 10px rgba(16,30,84,.05)}
.form .fld>span{margin-left:2px}
.ctl{width:100%;background:var(--field);border:1.5px solid transparent;border-radius:14px;padding:13px 14px;font-size:15.5px;outline:0;min-height:50px}
.ctl:focus{border-color:#9db2ec;background:#fff}
textarea.ctl{min-height:84px;resize:vertical}
.kinds{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.kinds button{border:1.5px solid var(--line);background:#fff;border-radius:16px;padding:12px;text-align:left;font-weight:700;font-size:14px}
.kinds button small{display:block;font-weight:500;color:var(--ink-2);font-size:12px;margin-top:2px}
.kinds button.on{border-color:var(--blue);background:var(--blue-soft)}
.info-line{background:var(--field);border-radius:12px;padding:10px 12px;font-size:13.5px;color:var(--ink-2);margin:-4px 0 14px}

/* ===== v0.3: transisi halus ===== */
:root{--ease-out:cubic-bezier(.16,1,.3,1);--ease:cubic-bezier(.2,.8,.2,1)}
@keyframes pgInR{from{opacity:0;transform:translateX(22px)}to{opacity:1;transform:none}}
@keyframes pgInL{from{opacity:0;transform:translateX(-22px)}to{opacity:1;transform:none}}
@keyframes pgInF{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}} @keyframes fadeOut{from{opacity:1}to{opacity:0}}
@keyframes sheetUp{from{transform:translateY(100%)}to{transform:none}} @keyframes sheetDown{from{transform:none}to{transform:translateY(100%)}}
@keyframes rise{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:none}}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,14px) scale(.96)}to{opacity:1;transform:translate(-50%,0)}}
@keyframes toastOut{to{opacity:0;transform:translate(-50%,10px)}}
.page.anim-r{animation:pgInR .34s var(--ease-out)} .page.anim-l{animation:pgInL .34s var(--ease-out)} .page.anim-f{animation:pgInF .3s var(--ease-out)}
.ov{animation:fadeIn .22s ease} .ov .sheet{animation:sheetUp .36s var(--ease-out)}
.ov.closing{animation:fadeOut .2s ease forwards;pointer-events:none} .ov.closing .sheet{animation:sheetDown .21s cubic-bezier(.4,0,1,1) forwards}
.splash{transition:opacity .38s ease,transform .38s ease} .splash.out{opacity:0;transform:scale(1.03)}
.login .top{animation:rise .55s .05s var(--ease-out) both} .login .sheet-card{animation:rise .6s .12s var(--ease-out) both} .login .mode-pill{animation:fadeIn .6s .3s both}
.toast{animation:toastIn .32s var(--ease-out)} .toast.out{animation:toastOut .25s ease forwards}
.btn,.btn-main,.btn-inst,.btn-guest,.chip-f,.nav button,.nm,.icon-btn,.row-card,.alert-card,.kinds button,.opt-grid button,.seg button,.menu-l button,.exp-opts button,.wd,.cal .d,.notif{transition:transform .16s var(--ease),background-color .22s ease,color .22s ease,box-shadow .22s ease,border-color .22s ease,opacity .2s}
.btn:active,.btn-main:active,.btn-inst:active,.btn-guest:active,.chip-f:active,.nav button:active,.nm:active,.icon-btn:active,.row-card:active,.alert-card:active,.kinds button:active,.opt-grid button:active,.menu-l button:active,.exp-opts button:active,.cal .d:active{transform:scale(.97)}
.hero,.stat,.card,.req,.form{animation:pgInF .4s var(--ease-out) both}
.stats .stat:nth-child(2){animation-delay:.03s}.stats .stat:nth-child(3){animation-delay:.06s}.stats .stat:nth-child(4){animation-delay:.09s}.stats .stat:nth-child(5){animation-delay:.12s}.stats .stat:nth-child(6){animation-delay:.15s}
.page:not([class*="anim-"]) .hero,.page:not([class*="anim-"]) .stat,.page:not([class*="anim-"]) .card,.page:not([class*="anim-"]) .req,.page:not([class*="anim-"]) .form{animation:none}
details.gd>summary{transition:color .2s}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;transition-duration:.01ms!important}}

.dnd-ghost{position:fixed;left:0;top:0;z-index:999;pointer-events:none;box-shadow:0 10px 24px rgba(16,30,84,.3);transform-origin:center;opacity:.95;scale:1.06;margin:0}
body.dnd-on,body.dnd-on *{cursor:grabbing!important;user-select:none}
td.c.dz{background:rgba(43,78,167,.06);box-shadow:inset 0 0 0 2px rgba(43,78,167,.25)}
td.c.dz-on{background:rgba(43,78,167,.18);box-shadow:inset 0 0 0 2px var(--blue)}
.sm-r{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 12px;background:#f5f6fa;border-radius:16px;margin-bottom:8px}
.sm-r .ava{width:38px;height:38px;border-radius:12px;background:var(--blue-soft);color:var(--blue);display:grid;place-items:center;font-weight:800}
.sm-r .tx{flex:1;min-width:90px} .sm-r .tx b{display:block} .sm-r .tx small{color:var(--ink-2);font-size:12px}
.gpick{display:flex;gap:6px;width:100%;padding-left:48px}
.gpick button{flex:1;border:1.5px solid var(--line);background:#fff;border-radius:11px;padding:8px 0;font-weight:800;color:var(--ink-2)}
.gpick button.on{background:var(--navy-900);border-color:var(--navy-900);color:#fff}
.gt-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.gt-grid div{background:#f5f6fa;border-radius:12px;padding:8px;text-align:center} .gt-grid small{display:block;color:var(--ink-3);font-size:11.5px} .gt-grid b{font-size:13.5px}
/* ---- v0.6 ---- */
.nm.P{background:var(--st-L);border-color:transparent}
.swap-box{display:flex;gap:8px;align-items:flex-start;margin:8px 0 2px;padding:9px 11px;border-radius:12px;background:#eef3ff;color:#23367a;font-size:13px;line-height:1.45}
.swap-box svg{flex:none;margin-top:2px}
.opt-grid button:disabled{opacity:.4}
.rqb.sw{background:#2b4ea7}
/* ---- v0.7 ---- */
th.dh.hol,th.md.hol,th.mw.hol{background:#fde3e1!important;color:#c62828!important}
th.dh.hol button{color:#c62828}
.holn{display:block;font-size:10.5px;font-weight:700;color:#c62828;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.cal .d.hol small{color:#c62828;font-weight:800} .cal .d.hol{box-shadow:inset 0 0 0 1.5px #f3b2ad}
.wd.red small,.wd.red b{color:#d23b2e} .wd.sel.red small,.wd.sel.red b{color:#ffb3ab}
.holt{color:#ffc2bb;font-weight:700}
.code.hol{background:#fde3e1;color:#c62828}
.stat p .jam{color:var(--ok, #18915a)}
.zoom{display:inline-flex;align-items:center;background:#e3e7f2;border-radius:12px;padding:3px;gap:2px;margin-left:auto}
.zoom button{border:0;background:none;border-radius:9px;min-width:34px;height:32px;font-weight:800;font-size:16px;color:var(--ink)}
.zoom #zlbl{font-size:12.5px;min-width:52px;color:var(--ink-2)}
.zoom button:active{background:#fff}
.board-wrap{touch-action:pan-x pan-y}
.nm.flash{animation:flash 0.8s ease-in-out 3;outline:3px solid #ff9f1a;outline-offset:1px}
@keyframes flash{50%{transform:scale(1.08);box-shadow:0 0 0 6px rgba(255,159,26,.35)}}
.req .goto{display:flex;flex-wrap:wrap;gap:4px 14px;margin:6px 0 2px} .req .goto .lnk{margin:0;display:inline-flex;align-items:center;gap:5px;padding:4px 0}
.ot-box{background:#f2f7f1;border-radius:14px;padding:10px 12px;margin:10px 0 4px}
.ot-box .fld{margin:4px 0 8px} .ot-sum{margin:4px 0 0;font-size:13px;color:var(--ink-2);line-height:1.5} .ot-sum b{color:var(--ink)}
/* ---- v0.8 ---- */
.mdb{border:0;background:none;font:inherit;color:inherit;width:100%;height:100%;padding:0;cursor:pointer;border-radius:6px}
.mdb:hover,.mdb:focus-visible{background:rgba(43,78,167,.14)}
.mwk-h .atur{margin-left:auto;padding:6px 10px;font-size:12.5px} .mwk-h .atur + .lnk{margin-left:6px}
.nav button{font-size:11px;padding:9px 0 8px} .nav button svg{width:21px;height:21px}
.mon-f{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 2px}
.mon-hero{margin-top:12px;border-radius:26px;padding:20px 20px 16px;color:#fff;background:radial-gradient(120% 120% at 100% 0%,#3d6be0 0%,#1d327e 55%,#131f55 100%);box-shadow:0 22px 40px -22px rgba(19,31,85,.8)}
.mon-hero>small{color:rgba(255,255,255,.75);font-size:12.5px}
.mon-hero .big{font-size:46px;font-weight:800;letter-spacing:-1px;line-height:1.1;margin-top:4px} .mon-hero .big span{font-size:17px;font-weight:700;margin-left:6px;opacity:.8}
.mon-hero p{margin:2px 0 12px;color:rgba(255,255,255,.85);font-size:13.5px}
.mh-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.mh-grid div{background:rgba(255,255,255,.1);border-radius:14px;padding:9px 6px;text-align:center} .mh-grid b{display:block;font-size:19px} .mh-grid small{font-size:10.5px;color:rgba(255,255,255,.75);line-height:1.2;display:block}
.mh-prog{height:6px;border-radius:4px;background:rgba(255,255,255,.18);margin:14px 0 6px;overflow:hidden} .mh-prog span{display:block;height:100%;background:#fff;border-radius:4px}
.mon-hero>small:last-child{font-size:11.5px}
.mon-chart{padding:14px 12px 10px}
.mc-legend{display:flex;gap:14px;font-size:12px;color:var(--ink-2);margin-bottom:8px} .mc-legend span{display:flex;align-items:center;gap:6px} .mc-legend i{width:10px;height:10px;border-radius:3px}
.mc-wrap{display:flex;gap:6px;height:150px}
.mc-y{display:flex;flex-direction:column;justify-content:space-between;font-size:10.5px;color:var(--ink-3);padding-bottom:18px;text-align:right;min-width:16px}
.mc-bars{flex:1;display:flex;align-items:stretch;gap:2px;border-bottom:1px solid #e3e7f2;overflow-x:auto}
.mc-b{flex:1;min-width:8px;border:0;background:none;padding:0;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;cursor:pointer;border-radius:4px}
.mc-b .bar{width:70%;max-width:12px;border-radius:4px 4px 0 0;min-height:0}
.mc-b small{font-size:9px;color:var(--ink-3);height:18px;line-height:18px} .mc-b.red small{color:#d23b2e;font-weight:700} .mc-b.td small{color:var(--blue);font-weight:800}
.mc-b.sel{background:#eef2fb}
.mc-tip{font-size:12.5px;color:var(--ink-2);margin:8px 2px 0;line-height:1.5}
.mon-rank,.mon-gap{padding:6px}
.mr,.mg{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;text-align:left;font:inherit;color:inherit;padding:10px 8px;border-radius:14px}
.mr:active,.mg:active{background:#f2f4fa}
.mr .no{width:24px;height:24px;border-radius:8px;background:#eef1f8;display:grid;place-items:center;font-size:12px;font-weight:800;color:var(--ink-2);flex:none}
.mr .nm-c{flex:1;min-width:0} .mr .nm-c b{display:block;font-size:14px} .mr .nm-c small{display:flex;align-items:center;gap:5px;font-size:11.5px;color:var(--ink-2)}
.mr-bar{display:flex;gap:2px;height:7px;margin-top:6px} .mr-bar span{display:block;height:100%;border-radius:3px}
.mr .val{text-align:right;min-width:52px} .mr .val b{display:block;font-size:17px} .mr .val small{font-size:11px;color:var(--ink-2)}
.mg>span:nth-child(2){flex:1} .mg b{display:block;font-size:13.5px} .mg small{font-size:12px;color:var(--ink-2)}
.mg .ic{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;flex:none}
.ok-line{display:flex;gap:8px;align-items:center;padding:12px;color:#18915a;font-size:13.5px;font-weight:600}
/* ---- v0.9 ---- */
.agn{display:block;margin:4px 4px 2px;padding:4px 7px;border-radius:7px;background:#fff6c7;border:1px solid #f1d65a;color:#5b4700;font-size:11px;font-weight:600;line-height:1.3;text-align:left;white-space:normal;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;cursor:pointer}
th.dh .agn{max-width:100%}
.agn.dash{width:100%;margin:10px 0 0;font-size:12.5px;border:0;background:rgba(255,246,199,.95);-webkit-line-clamp:3}
.agn-add{display:block;margin:2px auto 0;border:1px dashed rgba(0,0,0,.18);background:transparent;color:var(--ink-3);font-size:10.5px;border-radius:6px;padding:1px 8px;opacity:.55;cursor:pointer}
.agn-add:hover{opacity:1;background:#fffbe3}
.mdb.hasag{background:#fff2a8;box-shadow:inset 0 -3px 0 #f1c40f}
.cpb{border:0;background:#e6ebf7;color:var(--blue);border-radius:7px;padding:3px 5px;margin-left:4px;vertical-align:middle;cursor:pointer;line-height:0}
.cpb:hover{background:#d4ddf3}
.wk-strip{display:flex;gap:8px;overflow-x:auto;margin:0 0 10px;padding-bottom:2px}
.wks{display:flex;align-items:center;gap:8px;flex:none;background:#fff;border-radius:14px;padding:7px 8px 7px 12px;box-shadow:0 1px 3px rgba(16,30,84,.08)}
.wks span b{display:block;font-size:12.5px} .wks span small{font-size:11px;color:var(--warn,#b26a00)} .wks.fin span small{color:#18915a;font-weight:700}
.wks .btn{padding:6px 10px;font-size:12px}
.cp-days{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin:6px 0 8px}
.cp-days button{border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:5px 0;font-weight:800;font-size:13px;color:var(--ink)}
.cp-days button small{display:block;font-size:10px;font-weight:600;color:var(--ink-3)}
.cp-days button.on{background:var(--navy-900);border-color:var(--navy-900);color:#fff} .cp-days button.on small{color:rgba(255,255,255,.7)}
.cp-days button.src{background:#fff2a8;border-color:#f1c40f;opacity:1} .cp-days button.red{color:#d23b2e}
.cp-wk{display:flex;flex-direction:column;gap:6px;margin:6px 0 8px}
.cp-wk button{border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:10px;font-weight:700;text-align:left}
.cp-wk button.on{background:var(--navy-900);border-color:var(--navy-900);color:#fff} .cp-wk button:disabled{opacity:.45}
.sheet .mini-seg{margin-bottom:4px}
.mwk-h .wkb{padding:6px 10px;font-size:12.5px;margin-left:4px}

</style>

  // =====================================================================
  // PENGINGAT SHIFT & NOTIFIKASI HP
  //  - Aplikasi Android (APK): notifikasi lokal terjadwal (LocalNotifications) + pengecekan
  //    notifikasi server tiap ±15 menit di latar belakang (BackgroundRunner) → muncul di layar notifikasi HP.
  //  - Browser / iPhone: pengingat & notifikasi saat aplikasi terbuka + ekspor kalender (.ics) dengan alarm.
  // =====================================================================
  const CAP = window.Capacitor, IS_NATIVE = !!(CAP && CAP.isNativePlatform && CAP.isNativePlatform());
  const LNP = IS_NATIVE && CAP.Plugins && CAP.Plugins.LocalNotifications, BRP = IS_NATIVE && CAP.Plugins && CAP.Plugins.BackgroundRunner;
  const BG_LABEL = "id.indospring.shiftp3.bg", REM_BASE = 7000000;
  const APK_URL = window.APK_URL || "https://github.com/falassp-gif/shift-p3-android/releases/latest/download/Shift-P3.apk";
  const REM_OPTS = [[15, "15 menit"], [30, "30 menit"], [45, "45 menit"], [60, "1 jam"], [90, "1,5 jam"], [120, "2 jam"], [180, "3 jam"], [720, "12 jam"]];
  function remCfg() { let o = {}; try { o = JSON.parse(LS.get("ms3.rem") || "{}"); } catch (e) { } return Object.assign({ on: false, min: 60, alert: true }, o); }

  // shift-shift saya yang akan datang (maks 14 hari) → waktu pengingat
  function upcomingReminders() {
    const c = remCfg(), me = st.user && meU(), m = me && st.byU[me], out = []; if (!c.on || !me) return out;
    for (let i = -1; i <= 14; i++) { const ds = iso(addDays(new Date(), i)), a = A(ds, me), t = startAt(ds, a, m); if (!t) continue;
      const at = t.getTime() - c.min * 60000; if (at <= Date.now() + 5000) continue;
      const hm = String(t.getHours()).padStart(2, "0") + "." + String(t.getMinutes()).padStart(2, "0");
      out.push({ id: REM_BASE + Number(ds.replace(/-/g, "")) % 1000000, at, title: `Pengingat shift — ${(REM_OPTS.find(x => x[0] === c.min) || [0, c.min + " menit"])[1]} lagi`, body: `${statusText(a, ds, m)} · mulai ${hm} WIB (${fmtShort(ds)})${LIBUR[ds] ? " · " + holOf(ds).n : ""}` }); }
    return out;
  }
  let remTimer = null;
  async function syncDevice() {
    try {
      if (IS_NATIVE) {
        if (BRP) BRP.dispatchEvent({ label: BG_LABEL, event: "config", details: { server: serverUrl ? serverUrl() : "", token: st.token || "", me: st.user ? st.user.surname : "", last: (st.notifs[0] || {}).Waktu || "", on: remCfg().alert && st.user ? "1" : "0" } }).catch(() => { });
        if (!LNP) return;
        const pend = await LNP.getPending().catch(() => ({ notifications: [] }));
        const old = (pend.notifications || []).filter(n => n.id >= REM_BASE && n.id < REM_BASE + 1000000).map(n => ({ id: n.id }));
        if (old.length) await LNP.cancel({ notifications: old }).catch(() => { });
        const list = upcomingReminders(); if (!list.length) return;
        const perm = await LNP.checkPermissions(); if (perm.display !== "granted") { const r = await LNP.requestPermissions(); if (r.display !== "granted") return; }
        await LNP.schedule({ notifications: list.map(r => ({ id: r.id, title: r.title, body: r.body, schedule: { at: new Date(r.at), allowWhileIdle: true } })) });
      } else {

  async function showSysNotif(title, body) {
    if (IS_NATIVE && LNP) { try { await LNP.schedule({ notifications: [{ id: Math.floor(Math.random() * 1e6) + 100, title, body }] }); return; } catch (e) { } }
    try { if ("Notification" in window && Notification.permission === "granted") { const reg = navigator.serviceWorker && await navigator.serviceWorker.getRegistration(); if (reg) reg.showNotification(title, { body, icon: "icons/icon-192.png", badge: "icons/icon-192.png" }); else new Notification(title, { body }); return; } } catch (e) { }

    if (!("Notification" in window)) return false; if (Notification.permission === "granted") return true;

  // kalender HP (.ics) dengan alarm — untuk iPhone / HP yang memakai versi web
  function downloadIcs() {
    const me = meU(), m = st.byU[me], c = remCfg(), pad = n => String(n).padStart(2, "0");
    const f = d => `${d.getFullYear()}${pad(d.getMonth() + 1)}${pad(d.getDate())}T${pad(d.getHours())}${pad(d.getMinutes())}00`;
    const L = ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//Indospring//Shift P3//ID", "CALSCALE:GREGORIAN", "X-WR-CALNAME:Shift P3 " + m.surname, "X-WR-TIMEZONE:Asia/Jakarta"];
    let n = 0;
    for (let i = 0; i <= 62; i++) { const ds = iso(addDays(new Date(), i)), a = A(ds, me), t = startAt(ds, a, m); if (!t) continue;
      const hrs = String(hours(ds, a, m)).match(/(\d{2})\.(\d{2})\D+(\d{2})\.(\d{2})/); const end = new Date(t.getTime() + 8 * 3600e3);
      if (hrs) { end.setTime(t.getTime()); end.setHours(+hrs[3], +hrs[4]); if (end <= t) end.setDate(end.getDate() + 1); }
      L.push("BEGIN:VEVENT", `UID:shiftp3-${me}-${ds}@indospring`, `DTSTAMP:${f(new Date())}`, `DTSTART;TZID=Asia/Jakarta:${f(t)}`, `DTEND;TZID=Asia/Jakarta:${f(end)}`,
        `SUMMARY:${statusText(a, ds, m).replace(/[,;]/g, " ")}`, `DESCRIPTION:${hours(ds, a, m).replace(/[,;]/g, " ")} WIB · Shift Maintenance P3`,
        "BEGIN:VALARM", "ACTION:DISPLAY", "DESCRIPTION:Pengingat shift", `TRIGGER:-PT${c.min || 60}M`, "END:VALARM", "END:VEVENT"); n++; }
    L.push("END:VCALENDAR");
    const blob = new Blob([L.join("\r\n")], { type: "text/calendar" }), url = URL.createObjectURL(blob), aEl = document.createElement("a");
    aEl.href = url; aEl.download = `Shift-P3-${m.surname}.ics`; document.body.appendChild(aEl); aEl.click(); aEl.remove(); setTimeout(() => URL.revokeObjectURL(url), 5000);
    toast(`${n} jadwal shift (2 bulan) diekspor ke kalender dengan alarm ${c.min} menit sebelumnya.`);
  }

  function monthWeeks(y, mo) { const first = new Date(y, mo, 1), last = new Date(y, mo + 1, 0); const out = []; for (let d = wkStart(first); d <= last; d = addDays(d, 7)) out.push(iso(d)); return out; }
  const weekDays = ws => Array.from({ length: 7 }, (_, i) => iso(addDays(parse(ws), i)));
  // ---------- zoom papan (tombol, cubit 2 jari, Ctrl + scroll) ----------
  const zoomOf = k => Math.min(1.6, Math.max(0.5, Number(LS.get("ms3.z." + k)) || 1));
  function setupZoom(pg, k, wraps) {
    const tools = pg.querySelector(".tools"); if (!tools || !wraps.length) return;
    tools.insertAdjacentHTML("beforeend", `<div class="zoom" role="group" aria-label="Zoom"><button data-z="-1" aria-label="Perkecil">−</button><button id="zlbl" data-z="0" title="Kembali 100%">100%</button><button data-z="1" aria-label="Perbesar">+</button></div>`);
    const put = (z, wrap, fx, fy) => {
      z = Math.min(1.6, Math.max(0.5, Math.round(z * 100) / 100));
      wraps.forEach(w => { const t = w.querySelector("table"); if (!t) return; const z0 = Number(t.style.zoom) || 1;
        const px = w === wrap && fx != null ? fx : w.clientWidth / 2, py = w === wrap && fy != null ? fy : w.clientHeight / 2;
        const cx = (w.scrollLeft + px) / z0, cy = (w.scrollTop + py) / z0; t.style.zoom = z; w.scrollLeft = cx * z - px; w.scrollTop = cy * z - py; });
      $("#zlbl").textContent = Math.round(z * 100) + "%"; return z;
    };
    wraps.forEach(w => { const t = w.querySelector("table"); if (t) t.style.zoom = zoomOf(k); }); $("#zlbl").textContent = Math.round(zoomOf(k) * 100) + "%";
    tools.querySelectorAll("[data-z]").forEach(b => b.onclick = () => { const d = Number(b.dataset.z), z = d ? zoomOf(k) + d * 0.1 : 1; LS.set("ms3.z." + k, put(z)); });
    wraps.forEach(w => {
      let d0 = 0, z0 = 1, last = 1;
      const dist = e => Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
      w.addEventListener("touchstart", e => { if (e.touches.length === 2) { d0 = dist(e); z0 = zoomOf(k); last = z0; } }, { passive: true });
      w.addEventListener("touchmove", e => { if (e.touches.length !== 2 || !d0) return; e.preventDefault(); const r = w.getBoundingClientRect();
        last = put(z0 * dist(e) / d0, w, (e.touches[0].clientX + e.touches[1].clientX) / 2 - r.left, (e.touches[0].clientY + e.touches[1].clientY) / 2 - r.top); }, { passive: false });
      w.addEventListener("touchend", e => { if (d0 && e.touches.length < 2) { d0 = 0; LS.set("ms3.z." + k, last); } }, { passive: true });
      w.addEventListener("wheel", e => { if (!e.ctrlKey) return; e.preventDefault(); const r = w.getBoundingClientRect(); LS.set("ms3.z." + k, put(zoomOf(k) * (e.deltaY < 0 ? 1.08 : 0.92), w, e.clientX - r.left, e.clientY - r.top)); }, { passive: false });
    });
  }

  async function decide(id, ok, extra = {}) {
    const r = st.reqs.find(x => x.ID === id); if (!r) return;
    let note = "", confirmOff2 = !!extra.confirmOff2;
    if (!ok) {
      note = await ask(`<h3>Tolak pengajuan?</h3><p class="sub">${esc(reqText(r))} · ${fmtShort(r.Tanggal)}</p><label class="fld"><span>Alasan (opsional)</span><textarea class="ctl" id="dn"></textarea></label><div class="sheet-acts"><button class="btn ghost" data-close>Batal</button><button class="btn no" data-ok>Tolak</button></div>`, s => $("#dn", s).value);
      if (note === null) return;
    } else {
      const w = r.Jenis === "Off" ? weekOff(r.Username, r.Tanggal, r.ID) : r.Jenis === "TukarOff" ? weekOff(r.Username, r.Tanggal2, r.ID, r.Tanggal) : null;
      if (w && ((w.off >= 2) || r.Peringatan)) {
        const nm = (st.byU[r.Username] || {}).surname || r.Username;
        const v = await ask(`<h3>Konfirmasi off 2x seminggu</h3><p class="sub">${esc(nm)} · minggu ${fmtDM(w.from)} – ${fmtDM(w.to)}</p>
          <div class="warn-box">${ic("warn", 18)}<span>Off di minggu ini: <b>${w.dates.map(fmtDM).join(", ")}</b> (${w.off}x).<br>Hari kerja: <b>${w.before} → ${w.work} hari</b>. Hitung ulang hari kerja / payroll untuk minggu ini.</span></div>
          <label class="chk"><input type="checkbox" id="c2"> Saya sudah mengecek dan menghitung ulang hari kerja</label>
          <label class="fld"><span>Catatan admin (opsional)</span><textarea class="ctl" id="c2n"></textarea></label><p class="err hide" id="c2e"></p>
          <div class="sheet-acts"><button class="btn ghost" data-close>Batal</button><button class="btn ok" data-ok>Setujui</button></div>`,
          s => { if (!$("#c2", s).checked) { const e = $("#c2e", s); e.textContent = "Centang konfirmasi terlebih dahulu."; e.classList.remove("hide"); return false; } return { note: $("#c2n", s).value.trim() }; });
        if (!v) return; note = v.note; confirmOff2 = true;
      }
      if ((isUrgent(r.Tanggal, A(r.Tanggal, r.Username), null, st.byU[r.Username]) || (r.Tanggal2 && isUrgent(r.Tanggal2, A(r.Tanggal2, r.Username), null, st.byU[r.Username]))) && !r.Catatan && !note) { note = await askReason("Alasan perubahan mendadak", "Pengajuan ini untuk shift yang mulai kurang dari 24 jam lagi."); if (!note) return; }
    }
    setSync("busy");
    try { await api("decideRequest", { id, approve: ok, note, confirmOff2 }); await Promise.all([loadReqs(), loadRange(st.range[0], st.range[1], true)]); render(); toast(ok ? "Disetujui — jadwal diperbarui." : "Pengajuan ditolak."); }
    catch (e) {
      setSync("ok");
      if (e.code === "OFF2" && !confirmOff2) return decide(id, ok, {});
      if (e.code === "ALASAN_WAJIB") { const why = await askReason("Alasan perubahan mendadak", "Isi alasan perubahan jadwal."); if (why) { try { await api("decideRequest", { id, approve: ok, note: why, confirmOff2 }); await Promise.all([loadReqs(), loadRange(st.range[0], st.range[1], true)]); render(); toast("Disetujui — jadwal diperbarui."); } catch (x) { toast(x.message); } } return; }
      setSync("err"); toast(e.message);
    }
  }

  function guideSheet() {

      ${sec("3. Mengajukan off / cuti / tukar / minta shift", `<ol class="steps"><li>Menu <b>Request</b> › pilih jenis › tanggal › catatan › <b>Kirim</b>.</li><li>Off 2x dalam seminggu (Minggu–Sabtu) akan muncul peringatan; wajib dicentang dan dikonfirmasi admin karena hari kerja dihitung ulang.</li><li>Pengajuan kurang dari 24 jam sebelum shift wajib diisi alasannya.</li><li>Status bisa dilihat di <b>Riwayat saya</b>; hasilnya juga masuk notifikasi (ikon lonceng).</li></ol>`)}
      ${sec("4. Notifikasi & update", `<ol class="steps"><li>Ikon lonceng: jadwal minggu sudah final, jadwal Anda diubah, keputusan pengajuan.</li><li>Bila muncul <b>Versi baru aplikasi tersedia</b>, ketuk <b>Perbarui</b>.</li></ol>`)}
      ${sec("5. Admin & Super Admin", `<ol class="steps"><li>Ketuk nama di jadwal untuk mengubah shift/status. Perubahan &lt; 24 jam sebelum shift wajib diberi alasan dan member diberi notifikasi.</li><li><b>Atur per hari</b> dan <b>Salin minggu lalu</b> untuk mengisi cepat; <b>Submit final</b> bila jadwal minggu sudah fix (semua member dapat notifikasi, bisa dibagikan ke WhatsApp).</li><li><b>Request › Persetujuan</b>: setujui / tolak; off 2x wajib dikonfirmasi.</li><li><b>Impor Excel</b> (Jadwal › Bulanan): file draft "Shift Maintenance" atau "Shift Payroll".</li><li>Super Admin: menu <b>Member</b> untuk tambah/ubah akun, otoritas, reset password, dan <b>Permintaan akun</b> dari tamu.</li></ol>`)}
      <div class="sheet-acts"><button class="btn pri" data-close>Tutup</button></div>`);
  }
